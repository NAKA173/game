<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あわいの旅路 ─ 第1章 体験版</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="frame">
    <div class="top">
      <span>あわいの旅路 <span class="dot">◈</span> 第1章「誰そ彼」体験版</span>
    </div>

    <div id="introPane" class="intro">
      <h1>あわいの旅路 <span>─ 第1章「誰そ彼」</span></h1>
      <p>新市街・本町。学校帰りの<em>空（そら）</em>は、昔から時々「際（きわ）」——現実に重なる薄い層——が見える。
      黄昏の路地で、鐘の音だけが響くあわいもの<em>鐘江（かなえ）</em>と出会うところから、第1章が始まる。</p>
      <div class="keys">
        <b>WASD / 矢印</b> 移動　<b>Shift</b> ダッシュ<br>
        統一3/4視点：奥へ進むほど小さく、手前ほど大きく見える<br>
        戦闘中：<b>J</b>こうげき　<b>K</b>鎮静（揺らぎ状態の相手に）
      </div>
      <button class="startbtn" id="newGameBtn">際に踏み込む ▸</button>
    </div>

    <div id="wrap" style="display:none">
      <canvas id="cv"></canvas>
      <div class="hud" id="battleHud" style="display:none">
        <div class="meter"><div class="lab">空 HP</div><div class="bar hp"><i id="phpBar" style="width:100%"></i></div></div>
        <div class="meter"><div class="lab" id="foeLab">あわいもの HP</div><div class="bar hp"><i id="fhpBar" style="width:100%"></i></div></div>
      </div>
      <div class="banner" id="banner"><div class="big" id="bBig"></div><div class="sub" id="bSub"></div></div>
      <div class="fade" id="fade"></div>

      <div class="introDialogue" id="introDialogue" style="display:none">
        <div class="introBox">
          <div class="introSpeaker" id="introSpeaker"></div>
          <div class="introText" id="introText"></div>
          <div class="introHint">クリック / Enterで次へ ▸</div>
        </div>
      </div>

      <div id="touch">
        <div id="stick"><div id="nub"></div></div>
        <div class="tbtns" id="exploreBtns" style="grid-template-columns:50px">
          <button class="tb" id="tDash">ダッシュ<small>Shift</small></button>
        </div>
        <div class="tbtns" id="battleBtns" style="display:none;grid-template-columns:repeat(2,56px)">
          <button class="tb" id="tAtk">こうげき<small>J</small></button>
          <button class="tb" id="tPacify">鎮静<small>K</small></button>
        </div>
      </div>
    </div>
    <div class="foot" id="foot">WASD 移動</div>
  </div>
</div>

<script src="js/engine.js"></script>
<script src="js/data.js"></script>
<script src="js/battle.js"></script>
<script src="js/explore.js"></script>
<script src="js/main.js"></script>
</body>
</html>
